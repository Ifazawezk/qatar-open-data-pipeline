[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qatar-open-data-pipeline"
version = "0.1.0"
description = "Batch pipeline that turns Qatar open data into a DuckDB warehouse and a Streamlit dashboard"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohaned Elhagar" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "plotly>=5.24"]
dev = ["pytest>=8.0", "responses>=0.25", "ruff>=0.6"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
