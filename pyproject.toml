[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qatar-open-data-pipeline"
version = "0.1.0"
description = "Batch pipeline that turns Qatar open data into a DuckDB warehouse and a Streamlit dashboard"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohaned Elhagar" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "pytz>=2024.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "plotly>=5.24"]
dev = ["pytest>=8.0", "responses>=0.25", "ruff>=0.6"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # raised inside DuckDB's DataFrame conversion with pandas 3.1, not in this code
    "ignore:The inplace keyword in DataFrame.drop is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the entry point puts the project root on sys.path before importing it
"dashboard/app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "dashboard", "conftest"]
