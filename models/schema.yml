# Data tests for every model. `python -m pipeline test` runs them against the
# warehouse; `python -m pipeline run` runs them inside the build transaction
# and rolls the build back if an error-level test fails.
#
# severity defaults to error. Use `severity: warn` for known source issues
# that should stay visible without blocking the pipeline.
#
# expression tests count rows where the condition is false; rows where it is
# NULL (missing data) are not counted.

sources:
  # How long ago we last confirmed each raw file with the portal.
  freshness:
    warn_after_days: 7
    error_after_days: 45

models:
  # ---------------------------------------------------------------- staging
  - name: stg_population_labour_force
    tests:
      - unique: [year, quarter, sex, indicator]
      - row_count: {min: 300}
      - query:
          name: every_quarter_has_all_indicators
          sql: |
            select year, quarter
            from {{ ref('stg_population_labour_force') }}
            group by year, quarter
            having count(*) <> 10
    columns:
      - name: year
        tests: [not_null, {range: {min: 2018, max: 2100}}]
      - name: quarter
        tests: [not_null, {range: {min: 1, max: 4}}]
      - name: sex
        tests: [not_null, {accepted_values: {values: [male, female]}}]
      - name: indicator
        tests:
          - not_null
          - accepted_values:
              values:
                - population
                - population_15_plus
                - economically_active
                - economically_inactive
                - employed
      - name: persons
        tests: [not_null, {range: {min: 0}}]

  - name: stg_cpi_monthly
    tests:
      - unique: [month_start, group_code]
      - row_count: {min: 900}
      - query:
          name: every_month_has_all_groups
          sql: |
            select month_start
            from {{ ref('stg_cpi_monthly') }}
            group by month_start
            having count(*) <> 13
    columns:
      - name: month_start
        tests: [not_null]
      - name: group_code
        tests: [not_null]
      - name: group_name_en
        # NULL means a group code that is missing from seeds/cpi_groups.csv
        tests: [not_null]
      - name: group_name_ar
        tests: [not_null]
      - name: cpi_index
        tests: [not_null, {range: {min: 50, max: 400}}]

  - name: stg_hia_passengers
    tests:
      - unique: [month_start, direction]
      - row_count: {min: 140}
    columns:
      - name: month_start
        tests: [not_null]
      - name: direction
        tests: [not_null, {accepted_values: {values: [arrivals, departures]}}]
      - name: passengers
        tests: [not_null, {range: {min: 0, max: 5000000}}]

  - name: stg_hotel_guests_nights
    tests:
      - unique: [month_start, measure]
      - row_count: {min: 120}
    columns:
      - name: month_start
        tests: [not_null]
      - name: measure
        tests: [not_null, {accepted_values: {values: [guests, nights]}}]
      - name: value
        tests: [not_null, {range: {min: 0}}]

  - name: stg_electricity_by_zone
    tests:
      - unique: [year, zone_number]
      - row_count: {min: 500}
    columns:
      - name: year
        tests: [not_null, {range: {min: 2000, max: 2100}}]
      - name: zone_number
        tests: [not_null, {range: {min: 1, max: 99}}]
      - name: electricity_kwh
        tests: [not_null, {range: {min: 0}}]

  - name: stg_water_by_zone
    tests:
      - unique: [year, zone_number]
      - row_count: {min: 500}
    columns:
      - name: year
        tests: [not_null, {range: {min: 2000, max: 2100}}]
      - name: zone_number
        tests: [not_null, {range: {min: 1, max: 99}}]
      - name: water_m3
        tests: [not_null, {range: {min: 0}}]

  - name: stg_zones
    columns:
      - name: zone_number
        tests: [not_null, unique]
      - name: zone_name_en
        tests: [not_null]
      - name: zone_name_ar
        tests: [not_null]

  # ----------------------------------------------------------- intermediate
  - name: int_labour_force_quarterly
    tests:
      - unique: [quarter_start, sex]
      - expression:
          name: population_15_plus_is_active_plus_inactive
          sql: population_15_plus = economically_active + economically_inactive
      - expression:
          name: employed_within_active
          sql: employed <= economically_active
      - expression:
          name: adults_within_population
          sql: population_15_plus <= population

  - name: int_population_annual
    columns:
      - name: year
        tests: [not_null, unique]
      - name: quarters_reported
        tests: [{range: {min: 1, max: 4}}]
      - name: avg_population
        tests: [not_null, {range: {min: 1000000, max: 10000000}}]

  - name: int_cpi_monthly_changes
    tests:
      - unique: [month_start, group_code]

  - name: int_airport_monthly
    tests:
      - expression:
          name: passengers_is_arrivals_plus_departures
          sql: passengers = arrivals + departures
    columns:
      - name: month_start
        tests: [not_null, unique]

  - name: int_hotel_monthly
    columns:
      - name: month_start
        tests: [not_null, unique]
      - name: guests
        tests: [not_null]
      - name: nights
        tests: [not_null]

  - name: int_utilities_zone_annual
    tests:
      - unique: [year, zone_number]
    columns:
      - name: electricity_kwh
        # both KAHRAMAA files should cover the same zones and years
        tests: [not_null]
      - name: water_m3
        tests: [not_null]

  # ------------------------------------------------------------------ marts
  - name: dim_zone
    columns:
      - name: zone_number
        description: Official zone number (1 to 98).
        tests: [not_null, unique]
      - name: zone_name_en
        description: Full English name; multi-district zones list every district.
      - name: zone_name_ar
        description: Full Arabic name.
      - name: zone_short_name_en
        description: First district in the zone name, for charts.
      - name: zone_label
        description: "Display label such as: Zone 70: Leabaib and others."
        tests: [not_null, unique]
      - name: has_name
        description: False when the zone appears in the utility files but not in the names table.
        tests:
          - accepted_values: {values: [true], severity: warn}

  - name: dim_month
    columns:
      - name: month_start
        description: First day of the month; join key for monthly facts.
        tests: [not_null, unique]
      - name: year_month
        description: Text label YYYY-MM.
      - name: month_name_ar
        description: Arabic month name, in the form the portal uses (يناير, فبراير...).
        tests: [not_null]

  - name: fct_labour_market_quarterly
    tests:
      - unique: [quarter_start, sex]
      - freshness: {column: quarter_start, warn_after_days: 300, error_after_days: 900}
    columns:
      - name: quarter_start
        description: First day of the survey quarter.
      - name: sex
        description: male, female or total (sum of both).
        tests: [{accepted_values: {values: [male, female, total]}}]
      - name: population
        description: Total population (all ages).
      - name: population_15_plus
        description: Population aged 15 and above.
      - name: economically_active
        description: Labour force aged 15+ (employed plus unemployed).
      - name: unemployed
        description: Economically active minus employed.
      - name: participation_rate_pct
        description: Economically active / population 15+, in percent.
        tests: [not_null, {range: {min: 0, max: 100}}]
      - name: unemployment_rate_pct
        description: Unemployed / economically active, in percent.
        tests: [not_null, {range: {min: 0, max: 100}}]
      - name: employment_to_population_pct
        description: Employed / population 15+, in percent.
      - name: population_yoy_pct
        description: Change in population against the same quarter a year earlier.
        tests: [{range: {min: -20, max: 30, severity: warn}}]

  - name: fct_cpi_monthly
    tests:
      - unique: [month_start, group_code]
      # The portal publishes CPI with a delay; warn once it is clearly behind.
      - freshness: {column: month_start, warn_after_days: 150, error_after_days: 800}
    columns:
      - name: group_code
        description: Three-digit expenditure group code; 000 is the general index.
      - name: group_name_en
        description: Cleaned English group name (from seeds/cpi_groups.csv).
      - name: group_name_ar
        description: Arabic group name from the source, whitespace normalised.
      - name: cpi_index
        description: Index value, base year 2018 = 100.
      - name: mom_change_pct
        description: Change against the previous month, in percent.
      - name: yoy_change_pct
        description: Change against the same month a year earlier, in percent.
        tests: [{range: {min: -50, max: 50, severity: warn}}]

  - name: fct_inflation_annual
    tests:
      - unique: [year, group_code]
    columns:
      - name: months_reported
        description: Months of data in the year; changes need 12.
        tests: [{range: {min: 1, max: 12}}]
      - name: avg_index
        description: Average of the monthly index values.
      - name: avg_inflation_pct
        description: Change in the annual average index against the previous year.
      - name: dec_on_dec_pct
        description: December index against the previous December.

  - name: fct_travel_monthly
    tests:
      - unique: [month_start]
      # Known source issue: from January 2019 to January 2020 the published
      # nights are lower than the guests, which cannot be right. Kept visible.
      - expression:
          name: nights_at_least_guests
          sql: hotel_nights >= hotel_guests
          severity: warn
      # Neither travel series has been updated on the portal since 2023.
      - freshness: {column: month_start, warn_after_days: 400}
    columns:
      - name: airport_arrivals
        description: Arriving passengers at Hamad International Airport.
      - name: airport_departures
        description: Departing passengers at Hamad International Airport.
      - name: airport_passengers
        description: Arrivals plus departures (no transit).
        tests: [{range: {min: 0, max: 10000000}}]
      - name: hotel_guests
        description: Hotel guests in the month.
      - name: hotel_nights
        description: Nights of stay in the month.
      - name: nights_per_guest
        description: Hotel nights divided by hotel guests.
      - name: airport_passengers_yoy_pct
        description: Change against the same month a year earlier.
      - name: hotel_guests_yoy_pct
        description: Change against the same month a year earlier.

  - name: fct_utilities_zone_annual
    tests:
      - unique: [year, zone_number]
    columns:
      - name: zone_number
        tests:
          - not_null
          - relationships: {to: dim_zone, field: zone_number}
      - name: zone_label
        tests: [not_null]
      - name: is_complete_year
        description: False for the running year, which KAHRAMAA publishes as a partial total.
      - name: electricity_kwh
        description: Electricity consumption in kWh.
      - name: water_m3
        description: Water consumption in cubic metres.
      - name: electricity_share_pct
        description: Share of the national electricity total in that year.
        tests: [{range: {min: 0, max: 100}}]
      - name: electricity_rank
        description: 1 = the zone with the highest consumption that year.
      - name: electricity_yoy_pct
        description: Change against the previous year (complete years only).

  - name: fct_utilities_national_annual
    tests:
      - expression:
          name: most_zones_reported
          sql: zones_reported >= 85
      - expression:
          name: no_per_capita_for_partial_years
          sql: is_complete_year or electricity_kwh_per_capita is null
    columns:
      - name: year
        tests: [not_null, unique]
      - name: is_complete_year
        description: False for the running year (partial totals).
      - name: avg_population
        description: Average of the four quarterly population estimates.
      - name: electricity_kwh_per_capita
        description: Electricity kWh per resident (complete years only).
        tests: [{range: {min: 5000, max: 40000, severity: warn}}]
      - name: water_m3_per_capita
        description: Water cubic metres per resident (complete years only).
      - name: water_litres_per_capita_per_day
        description: Water litres per resident per day (complete years only).
        tests: [{range: {min: 100, max: 1500, severity: warn}}]

  - name: mart_annual_indicators
    columns:
      - name: year
        tests: [not_null, unique]
      - name: avg_population
        description: Average quarterly population (years with four quarters).
      - name: population_growth_pct
        description: Change in average population against the previous year.
      - name: participation_rate_pct
        description: Labour force participation, all quarters of the year pooled.
      - name: female_participation_rate_pct
        description: Female labour force participation, quarters pooled.
      - name: unemployment_rate_pct
        description: Unemployment rate, quarters pooled.
        tests: [{range: {min: 0, max: 30}}]
      - name: cpi_inflation_pct
        description: Change in the annual average general CPI.
        tests: [{range: {min: -20, max: 50, severity: warn}}]
      - name: airport_passengers
        description: Hamad International Airport passengers (years with 12 months).
      - name: hotel_guests
        description: Hotel guests (years with 12 months).
      - name: electricity_gwh
        description: National electricity consumption in GWh (complete years).
      - name: electricity_kwh_per_capita
        description: Electricity kWh per resident.
      - name: water_litres_per_capita_per_day
        description: Water litres per resident per day.
